[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "injectlab"
version = "0.0.1"
description = "A measurement harness for indirect prompt injection against tool-using LLM agents."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
# ruff is pinned exactly: its default rule set widens between minor releases, so
# an unpinned range lets CI install a newer ruff than the one developed against
# and fail on rules that never ran locally. Pin + explicit select below = the
# lint behaves identically everywhere. Bump deliberately, not by drift.
dev = ["pytest>=7", "ruff==0.17.0"]

[project.scripts]
injectlab = "injectlab.cli:main"

[tool.setuptools.packages.find]
include = ["injectlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Explicit rule set (ruff's historical default) rather than the implicit default,
# which widens between versions. Pinned here so the lint is the contract, not a
# moving target. This project intentionally contains confusable and zero-width
# characters as attack/test fixtures, so unicode-ambiguity rules (RUF001/002/003)
# would be pure noise and are deliberately not enabled.
select = ["E4", "E7", "E9", "F"]
